name: Research software reach

on:
  schedule:
    # Monthly: citations, downloads and stars do not need daily snapshots.
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BOAST_VERSION: '0.5.0'

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned boast
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/mbhall88/boast/releases/download/${BOAST_VERSION}/boast-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Collect NEXCISION reach snapshot
        id: boast_nexcision
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALTMETRIC_KEY: ${{ secrets.ALTMETRIC_KEY }}
        run: |
          boast about impact/nexcision.toml \
            --snapshot-dir impact/snapshots/nexcision \
            --wait-for-cohort-ranks=5m

      - name: Collect BRANCHSNV reach snapshot
        id: boast_branchsnv
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALTMETRIC_KEY: ${{ secrets.ALTMETRIC_KEY }}
        run: |
          boast about impact/branchsnv.toml \
            --snapshot-dir impact/snapshots/branchsnv \
            --wait-for-cohort-ranks=5m

      - name: Update website metrics from newest snapshots
        if: always()
        run: |
          set -euo pipefail

          if find impact/snapshots/nexcision -maxdepth 1 -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python scripts/boast_to_site.py \
              nexcision \
              impact/snapshots/nexcision \
              data/impact/nexcision.json
          else
            echo "No NEXCISION snapshot was written; retaining last-known-good website metrics."
          fi

          if find impact/snapshots/branchsnv -maxdepth 1 -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python scripts/boast_to_site.py \
              branchsnv \
              impact/snapshots/branchsnv \
              data/impact/branchsnv.json
          else
            echo "No BRANCHSNV snapshot was written; retaining last-known-good website metrics."
          fi

      - name: Commit snapshots and site metrics
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A impact/snapshots data/impact
          git diff --cached --quiet && exit 0
          git commit -m "chore: monthly research software reach snapshot"
          git push

      - name: Surface provider failures
        if: ${{ always() && (steps.boast_nexcision.outcome == 'failure' || steps.boast_branchsnv.outcome == 'failure') }}
        run: |
          echo "boast recorded one or more provider failures. Any partial snapshots were still preserved." >&2
          exit 1
